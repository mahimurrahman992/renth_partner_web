name: renth_manager
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+7

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  velocity_x: ^4.3.1
  # Local compatibility patches for Flutter 3.44 (IconData is final and the
  # html package no longer exposes its old top-level selector matcher).
  flutter_html:
    path: packages/flutter_html
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  firebase_messaging: ^15.2.10
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.2.0
  device_info_plus: ^11.5.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  share_plus: ^12.0.0
  http: ^1.2.2
  get_storage: ^2.1.1
  cached_network_image: ^3.4.1
  flutter_inappwebview: ^6.1.5
  ionicons:
    path: packages/ionicons
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.3
  flutter_pdfview: ^1.4.4
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  hold_to_confirm_button: ^0.0.2
  video_player: ^2.7.2
  youtube_player_flutter: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_screenutil: ^5.9.3
  get_it: ^9.0.5
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"



flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
